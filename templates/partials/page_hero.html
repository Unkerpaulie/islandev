{% load static %}
<!--
  Compact page hero for inner pages (Services, Portfolio, etc.)
  Variables: badge (optional), title (required), subtitle (optional),
  hero_image (optional static filename, defaults to services.png)
-->
<section class="bg-brand-bg pt-32 pb-16 relative overflow-hidden border-b border-brand-cyan/10">
  <div class="max-w-7xl mx-auto px-6 relative">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
      <div class="relative z-10">
        {% if badge %}
          <p class="text-xs font-semibold tracking-widest text-brand-teal uppercase mb-4">{{ badge }}</p>
        {% endif %}
        <h1 class="text-3xl lg:text-4xl xl:text-5xl font-semibold text-brand-text leading-tight tracking-tight mb-5">
          {{ title }}
        </h1>
        {% if subtitle %}
          <p class="text-base lg:text-lg text-gray-700 leading-relaxed max-w-xl">
            {{ subtitle }}
          </p>
        {% endif %}
      </div>

      <div class="hidden lg:block" style="position:absolute; right:0; top:50%; transform:translateY(-50%); width:50%; opacity:0.55;">
        <div class="relative rounded-xl overflow-hidden">
          {% if hero_image %}
            <img src="{% static hero_image %}"
                 alt=""
                 class="w-full h-auto block">
          {% else %}
            <img src="{% static 'images/services.png' %}"
                 alt=""
                 class="w-full h-auto block">
          {% endif %}
          <div class="absolute inset-0"
               style="background: linear-gradient(to right, #ECEDF0 0%, rgba(236,237,240,0) 40%);"></div>
        </div>
      </div>
    </div>
  </div>
</section>
